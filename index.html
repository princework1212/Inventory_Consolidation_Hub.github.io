<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>庫存報表整合工具 (簡化版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-section {
            background: #f8f9fa;
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-section.drag-over {
            border-color: #764ba2;
            background: #e8ebff;
        }

        #fileInput {
            display: none;
        }

        .upload-label {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .upload-label:hover {
            transform: translateY(-2px);
        }

        .file-list {
            margin-top: 20px;
            text-align: left;
        }

        .file-item {
            background: white;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-item .remove-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .file-item .remove-btn:hover {
            background: #ff5252;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 30px 0;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .output-section {
            display: none;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #e9ecef;
        }

        .output-section.active {
            display: block;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
        }

        .tab {
            padding: 12px 20px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
            max-height: 600px;
            overflow-y: auto;
        }

        .tab-content.active {
            display: block;
        }

        .table-container {
            overflow-x: auto;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid #e9ecef;
        }

        tr:hover {
            background: #f0f2ff;
        }

        .download-section {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .download-btn {
            flex: 1;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .download-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .status.active {
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .loader {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loader.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid;
        }

        .stat-box.files {
            background: #e8ebff;
            border-left-color: #667eea;
        }

        .stat-box.records {
            background: #e8f5e9;
            border-left-color: #28a745;
        }

        .stat-box.products {
            background: #fce4ec;
            border-left-color: #e91e63;
        }

        .stat-box.shops {
            background: #fff3e0;
            border-left-color: #ff9800;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
        }

        .select-control {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            min-width: 250px;
        }

        .select-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .control-group {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-group label {
            font-weight: 600;
            color: #333;
            min-width: 100px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            button {
                width: 100%;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 庫存報表整合工具</h1>
        <p class="subtitle">上傳多個 Excel 報表，自動整合生成統計結果</p>

        <div id="status" class="status"></div>

        <div class="tip-box">
            <strong>📝 提醒：</strong>xlsx檔案名稱需要依照日期命名（格式為20260301）
        </div>

        <div class="upload-section" id="dropZone">
            <label class="upload-label" for="fileInput">
                📁 選擇 Excel 檔案
            </label>
            <input type="file" id="fileInput" multiple accept=".xlsx,.xls">
            <p style="margin-top: 15px; color: #666; font-size: 14px;">
                或將檔案拖放到此區域
            </p>
            <div class="file-list" id="fileList"></div>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="processBtn" disabled>
                🔄 開始整合
            </button>
            <button class="btn-secondary" id="clearBtn">
                🗑️ 清除
            </button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p id="loaderText">正在處理檔案，請稍候...</p>
        </div>

        <div class="output-section" id="outputSection">
            <div class="tabs">
                <button class="tab active" data-tab="summary">
                    📈 整合摘要
                </button>
                <button class="tab" data-tab="preview">
                    👁️ 預覽結果
                </button>
                <button class="tab" data-tab="charts">
                    📊 圖表分析
                </button>
                <button class="tab" data-tab="detailed">
                    📋 詳細統計
                </button>
            </div>

            <div id="summary" class="tab-content active">
                <div id="summaryContent"></div>
            </div>

            <div id="preview" class="tab-content">
                <div style="margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap;">
                    <div class="control-group">
                        <label>顯示方式：</label>
                        <select id="previewToggle" class="select-control">
                            <option value="byShop">按門市分類</option>
                            <option value="byProduct">按商品分類</option>
                        </select>
                    </div>
                    <div class="control-group" id="previewFilterGroup">
                        <label id="previewFilterLabel">選擇門市：</label>
                        <select id="previewFilter" class="select-control">
                            <option value="">--全部--</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>顯示數量：</label>
                        <select id="previewRowLimit" class="select-control">
                            <option value="50">前50筆</option>
                            <option value="100">前100筆</option>
                            <option value="500">前500筆</option>
                            <option value="999999">全部</option>
                        </select>
                    </div>
                </div>
                <div id="previewByShop"></div>
                <div id="previewByProduct" style="display: none;"></div>
            </div>

            <div id="charts" class="tab-content">
                <div style="margin-bottom: 40px; background: #f8f9fa; padding: 20px; border-radius: 8px;">
                    <h3 style="margin-bottom: 20px; color: #333;">📊 各門市庫存分析</h3>
                    <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
                        <div class="control-group" style="flex: 1; min-width: 250px; margin-bottom: 0;">
                            <label>選擇門市：</label>
                            <select id="shopSelect" class="select-control">
                                <option value="">--選擇門市--</option>
                            </select>
                        </div>
                        <div class="control-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                            <label>顯示數量：</label>
                            <select id="shopTopSelect" class="select-control">
                                <option value="5">前5筆</option>
                                <option value="10">前10筆</option>
                                <option value="15">前15筆</option>
                                <option value="20" selected>前20筆</option>
                            </select>
                        </div>
                    </div>
                    <div id="shopChartContainer" style="max-width: 100%; overflow-x: auto; display: none;">
                        <div style="min-width: 800px;">
                            <canvas id="shopInventoryChart"></canvas>
                        </div>
                    </div>
                </div>

                <div style="margin-bottom: 40px; background: #f8f9fa; padding: 20px; border-radius: 8px;">
                    <h3 style="margin-bottom: 20px; color: #333;">🛍️ 各商品庫存分析</h3>
                    <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
                        <div class="control-group" style="flex: 1; min-width: 250px; margin-bottom: 0;">
                            <label>選擇商品：</label>
                            <select id="productSelect" class="select-control">
                                <option value="">--選擇商品--</option>
                            </select>
                        </div>
                        <div class="control-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                            <label>顯示數量：</label>
                            <select id="productTopSelect" class="select-control">
                                <option value="5">前5筆</option>
                                <option value="10">前10筆</option>
                                <option value="15">前15筆</option>
                                <option value="20" selected>前20筆</option>
                            </select>
                        </div>
                    </div>
                    <div id="productChartContainer" style="max-width: 900px; margin: 0 auto; display: none;">
                        <canvas id="productInventoryChart"></canvas>
                    </div>
                </div>


            </div>

            <div id="detailed" class="tab-content">
                <div id="detailedContent"></div>
            </div>

            <div class="download-section" id="downloadSection">
                <button class="download-btn" id="downloadXlsxByShop">
                    📥 下載 (按門市)
                </button>
                <button class="download-btn" id="downloadXlsxByProduct">
                    📥 下載 (按商品)
                </button>
            </div>
        </div>
    </div>

    <script>
        let selectedFiles = [];
        let processedData = null;

        // 監聽拖放
        const dropZone = document.getElementById('dropZone');
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const files = Array.from(e.dataTransfer.files);
            addFiles(files);
        });

        // 檔案選擇
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            addFiles(files);
        });

        function addFiles(files) {
            const excelFiles = files.filter(f => 
                f.name.endsWith('.xlsx') || f.name.endsWith('.xls')
            );

            if (excelFiles.length === 0) {
                showStatus('請選擇 Excel 檔案 (.xlsx 或 .xls)', 'warning');
                return;
            }

            selectedFiles = [...selectedFiles, ...excelFiles];
            updateFileList();
            document.getElementById('processBtn').disabled = false;
        }

        function updateFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';

            selectedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <span>📄 ${file.name} (${(file.size / 1024).toFixed(1)} KB)</span>
                    <button class="remove-btn" onclick="removeFile(${index})">移除</button>
                `;
                fileList.appendChild(item);
            });
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
            if (selectedFiles.length === 0) {
                document.getElementById('processBtn').disabled = true;
            }
        }

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.className = `status active ${type}`;
            status.textContent = message;
        }

        // 處理檔案
        document.getElementById('processBtn').addEventListener('click', async () => {
            if (selectedFiles.length === 0) {
                showStatus('請先選擇檔案', 'warning');
                return;
            }

            const loader = document.getElementById('loader');
            loader.classList.add('active');
            showStatus('🔄 正在整合檔案...', 'info');

            try {
                // 讀取所有 Excel 檔案
                const allData = [];
                const allDates = new Set();

                for (const file of selectedFiles) {
                    const arrayBuffer = await file.arrayBuffer();
                    const workbook = XLSX.read(new Uint8Array(arrayBuffer));
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const data = XLSX.utils.sheet_to_json(sheet);

                    // 從檔案名稱提取日期
                    let dateStr = null;
                    const parts = file.name.replace('.xlsx', '').replace('.xls', '').split('_');
                    for (const part of parts) {
                        if (part.length === 8 && /^\d+$/.test(part)) {
                            dateStr = part;
                            break;
                        }
                    }
                    dateStr = dateStr || 'UNKNOWN';

                    // 添加日期欄位
                    data.forEach(row => {
                        row['報表日期'] = dateStr;
                    });

                    allData.push(...data);
                    allDates.add(dateStr);
                }

                // 數據整合
                const consolidatedData = consolidateData(allData, Array.from(allDates).sort());
                processedData = consolidatedData;

                displayResults();
                showStatus('✅ 整合完成！', 'success');
            } catch (error) {
                showStatus('❌ 錯誤: ' + error.message, 'error');
                console.error(error);
            } finally {
                loader.classList.remove('active');
            }
        });

        function consolidateData(allData, dates) {
            const byShopProduct = {};  // 門市-商品
            const byProductShop = {};  // 商品-門市
            let totalRecords = 0;
            const uniqueProducts = new Set();
            const uniqueShops = new Set();

            for (const row of allData) {
                const product = row['商品名稱'] || 'N/A';
                const shop = row['門市名稱'] || 'N/A';
                const inventory = parseFloat(row['剩餘庫存量']) || 0;
                const date = row['報表日期'];

                // 以門市-商品為主
                const keyByShop = `${shop}||${product}`;
                if (!byShopProduct[keyByShop]) {
                    byShopProduct[keyByShop] = { shop, product, dates: {} };
                }
                byShopProduct[keyByShop].dates[date] = inventory;

                // 以商品-門市為主
                const keyByProduct = `${product}||${shop}`;
                if (!byProductShop[keyByProduct]) {
                    byProductShop[keyByProduct] = { product, shop, dates: {} };
                }
                byProductShop[keyByProduct].dates[date] = inventory;

                totalRecords++;
                uniqueProducts.add(product);
                uniqueShops.add(shop);
            }

            // 計算平均值
            const calculateAverage = (dataObj) => {
                for (const key in dataObj) {
                    let sum = 0;
                    let count = 0;
                    for (const date in dataObj[key].dates) {
                        sum += dataObj[key].dates[date];
                        count++;
                    }
                    dataObj[key].average = count > 0 ? (sum / count).toFixed(2) : 0;
                }
            };

            calculateAverage(byShopProduct);
            calculateAverage(byProductShop);

            return {
                success: true,
                dates: dates,
                summary: {
                    total_files: selectedFiles.length,
                    total_records: totalRecords,
                    unique_products: uniqueProducts.size,
                    unique_shops: uniqueShops.size
                },
                byShop: byShopProduct,
                byProduct: byProductShop
            };
        }

        function displayResults() {
            const outputSection = document.getElementById('outputSection');
            outputSection.classList.add('active');

            // 摘要
            const summary = processedData.summary;
            const summaryHtml = `
                <div class="stats-grid">
                    <div class="stat-box files">
                        <div class="stat-label">檔案數量</div>
                        <div class="stat-value">${summary.total_files}</div>
                    </div>
                    <div class="stat-box records">
                        <div class="stat-label">總記錄數</div>
                        <div class="stat-value">${summary.total_records}</div>
                    </div>
                    <div class="stat-box products">
                        <div class="stat-label">商品數</div>
                        <div class="stat-value">${summary.unique_products}</div>
                    </div>
                    <div class="stat-box shops">
                        <div class="stat-label">門市數</div>
                        <div class="stat-value">${summary.unique_shops}</div>
                    </div>
                </div>
                <p style="color: #666; font-size: 14px;">
                    <strong>日期範圍：</strong> ${processedData.dates.join(' → ')}
                </p>
            `;
            document.getElementById('summaryContent').innerHTML = summaryHtml;

            // 按門市分類預覽
            let previewByShopHtml = '<div class="table-container"><table><thead><tr>';
            previewByShopHtml += '<th>門市名稱</th><th>商品名稱</th>';
            processedData.dates.forEach(date => {
                previewByShopHtml += `<th>${date}</th>`;
            });
            previewByShopHtml += '<th>平均庫存量</th></tr></thead><tbody>';

            let rowCount = 0;
            for (const key in processedData.byShop) {
                if (rowCount >= 30) break;
                const item = processedData.byShop[key];
                previewByShopHtml += `<tr><td>${item.shop}</td><td>${item.product}</td>`;
                processedData.dates.forEach(date => {
                    const value = item.dates[date] || 0;
                    previewByShopHtml += `<td>${value.toFixed(1)}</td>`;
                });
                previewByShopHtml += `<td><strong>${item.average}</strong></td></tr>`;
                rowCount++;
            }
            previewByShopHtml += '</tbody></table></div>';
            document.getElementById('previewByShop').innerHTML = previewByShopHtml;

            // 按商品分類預覽
            let previewByProductHtml = '<div class="table-container"><table><thead><tr>';
            previewByProductHtml += '<th>商品名稱</th><th>門市名稱</th>';
            processedData.dates.forEach(date => {
                previewByProductHtml += `<th>${date}</th>`;
            });
            previewByProductHtml += '<th>平均庫存量</th></tr></thead><tbody>';

            rowCount = 0;
            for (const key in processedData.byProduct) {
                if (rowCount >= 30) break;
                const item = processedData.byProduct[key];
                previewByProductHtml += `<tr><td>${item.product}</td><td>${item.shop}</td>`;
                processedData.dates.forEach(date => {
                    const value = item.dates[date] || 0;
                    previewByProductHtml += `<td>${value.toFixed(1)}</td>`;
                });
                previewByProductHtml += `<td><strong>${item.average}</strong></td></tr>`;
                rowCount++;
            }
            previewByProductHtml += '</tbody></table></div>';
            document.getElementById('previewByProduct').innerHTML = previewByProductHtml;

            // 詳細統計
            const detailedHtml = `
                <div style="background: #f8f9fa; padding: 20px; border-radius: 8px;">
                    <h3 style="margin-bottom: 15px;">📊 數據統計</h3>
                    <p><strong>✓ 總記錄數：</strong> ${processedData.summary.total_records}</p>
                    <p><strong>✓ 獨特商品數：</strong> ${processedData.summary.unique_products}</p>
                    <p><strong>✓ 獨特門市數：</strong> ${processedData.summary.unique_shops}</p>
                    <p><strong>✓ 報表日期：</strong> ${processedData.dates.join(', ')}</p>
                    <hr style="margin: 15px 0; border: none; border-top: 1px solid #e9ecef;">
                    <p style="font-size: 12px; color: #666;">
                        ✨ 提供兩種格式下載：
                        <br>• <strong>按門市</strong> - 以門市為主，顯示各門市各商品的庫存
                        <br>• <strong>按商品</strong> - 以商品為主，顯示各商品在各門市的庫存
                    </p>
                </div>
            `;
            document.getElementById('detailedContent').innerHTML = detailedHtml;

            // 生成圖表
            generateCharts();

            // 初始化預覽篩選
            initializePreviewFilter();
        }

        function initializePreviewFilter() {
            const shopNames = Array.from(new Set(Object.values(processedData.byShop).map(item => item.shop).filter(shop => shop !== 'N/A'))).sort();
            const productNames = Array.from(new Set(Object.values(processedData.byProduct).map(item => item.product).filter(product => product !== 'N/A'))).sort();

            const previewFilter = document.getElementById('previewFilter');
            const previewFilterLabel = document.getElementById('previewFilterLabel');

            // 預覽分類切換事件
            document.getElementById('previewToggle').addEventListener('change', (e) => {
                const mode = e.target.value;
                document.getElementById('previewByShop').style.display = mode === 'byShop' ? 'block' : 'none';
                document.getElementById('previewByProduct').style.display = mode === 'byProduct' ? 'block' : 'none';

                // 更新篩選下拉選單
                if (mode === 'byShop') {
                    previewFilterLabel.textContent = '選擇門市：';
                    previewFilter.innerHTML = '<option value="">--全部--</option>';
                    shopNames.forEach(shop => {
                        const option = document.createElement('option');
                        option.value = shop;
                        option.textContent = shop;
                        previewFilter.appendChild(option);
                    });
                } else {
                    previewFilterLabel.textContent = '選擇商品：';
                    previewFilter.innerHTML = '<option value="">--全部--</option>';
                    productNames.forEach(product => {
                        const option = document.createElement('option');
                        option.value = product;
                        option.textContent = product;
                        previewFilter.appendChild(option);
                    });
                }
                previewFilter.value = '';
                const rowLimit = parseInt(document.getElementById('previewRowLimit').value);
                renderPreviewTable('byShop', '', rowLimit);
            });

            // 預覽篩選變更事件
            previewFilter.addEventListener('change', (e) => {
                const mode = document.getElementById('previewToggle').value;
                const selectedItem = e.target.value;
                const rowLimit = parseInt(document.getElementById('previewRowLimit').value);
                renderPreviewTable(mode, selectedItem, rowLimit);
            });

            // 顯示數量變更事件
            document.getElementById('previewRowLimit').addEventListener('change', (e) => {
                const mode = document.getElementById('previewToggle').value;
                const selectedItem = document.getElementById('previewFilter').value;
                const rowLimit = parseInt(e.target.value);
                renderPreviewTable(mode, selectedItem, rowLimit);
            });

            // 初始化默認為按門市
            previewFilterLabel.textContent = '選擇門市：';
            previewFilter.innerHTML = '<option value="">--全部--</option>';
            shopNames.forEach(shop => {
                const option = document.createElement('option');
                option.value = shop;
                option.textContent = shop;
                previewFilter.appendChild(option);
            });
        }

        function renderPreviewTable(mode, selectedItem, rowLimit = 50) {
            if (mode === 'byShop') {
                let html = '<div class="table-container"><table><thead><tr>';
                html += '<th>門市名稱</th><th>商品名稱</th>';
                processedData.dates.forEach(date => {
                    html += `<th>${date}</th>`;
                });
                html += '<th>平均庫存量</th></tr></thead><tbody>';

                let rowCount = 0;
                for (const key in processedData.byShop) {
                    const item = processedData.byShop[key];
                    
                    // 如果選擇了特定門市，只顯示該門市
                    if (selectedItem && item.shop !== selectedItem) continue;
                    
                    if (rowCount >= rowLimit) break;
                    html += `<tr><td>${item.shop}</td><td>${item.product}</td>`;
                    processedData.dates.forEach(date => {
                        const value = item.dates[date] || 0;
                        html += `<td>${value.toFixed(1)}</td>`;
                    });
                    html += `<td><strong>${item.average}</strong></td></tr>`;
                    rowCount++;
                }
                html += '</tbody></table></div>';
                document.getElementById('previewByShop').innerHTML = html;
            } else {
                let html = '<div class="table-container"><table><thead><tr>';
                html += '<th>商品名稱</th><th>門市名稱</th>';
                processedData.dates.forEach(date => {
                    html += `<th>${date}</th>`;
                });
                html += '<th>平均庫存量</th></tr></thead><tbody>';

                let rowCount = 0;
                for (const key in processedData.byProduct) {
                    const item = processedData.byProduct[key];
                    
                    // 如果選擇了特定商品，只顯示該商品
                    if (selectedItem && item.product !== selectedItem) continue;
                    
                    if (rowCount >= rowLimit) break;
                    html += `<tr><td>${item.product}</td><td>${item.shop}</td>`;
                    processedData.dates.forEach(date => {
                        const value = item.dates[date] || 0;
                        html += `<td>${value.toFixed(1)}</td>`;
                    });
                    html += `<td><strong>${item.average}</strong></td></tr>`;
                    rowCount++;
                }
                html += '</tbody></table></div>';
                document.getElementById('previewByProduct').innerHTML = html;
            }
        }

        let charts = {};

        function generateCharts() {
            // 準備門市和商品的選項（過濾掉 N/A）
            const shopNames = Array.from(new Set(Object.values(processedData.byShop).map(item => item.shop).filter(shop => shop !== 'N/A'))).sort();
            const productNames = Array.from(new Set(Object.values(processedData.byProduct).map(item => item.product).filter(product => product !== 'N/A'))).sort();

            // 填充門市下拉選單
            const shopSelect = document.getElementById('shopSelect');
            shopSelect.innerHTML = '<option value="">--選擇門市--</option>';
            shopNames.forEach(shop => {
                const option = document.createElement('option');
                option.value = shop;
                option.textContent = shop;
                shopSelect.appendChild(option);
            });

            // 填充商品下拉選單
            const productSelect = document.getElementById('productSelect');
            productSelect.innerHTML = '<option value="">--選擇商品--</option>';
            productNames.forEach(product => {
                const option = document.createElement('option');
                option.value = product;
                option.textContent = product;
                productSelect.appendChild(option);
            });

            // 門市選擇事件
            shopSelect.addEventListener('change', (e) => {
                const selectedShop = e.target.value;
                if (selectedShop) {
                    const topNum = parseInt(document.getElementById('shopTopSelect').value);
                    drawShopChart(selectedShop, topNum);
                    document.getElementById('shopChartContainer').style.display = 'block';
                } else {
                    document.getElementById('shopChartContainer').style.display = 'none';
                }
            });

            // 商品選擇事件
            productSelect.addEventListener('change', (e) => {
                const selectedProduct = e.target.value;
                if (selectedProduct) {
                    const topNum = parseInt(document.getElementById('productTopSelect').value);
                    drawProductChart(selectedProduct, topNum);
                    document.getElementById('productChartContainer').style.display = 'block';
                } else {
                    document.getElementById('productChartContainer').style.display = 'none';
                }
            });

            // 門市顯示數量變化事件
            document.getElementById('shopTopSelect').addEventListener('change', (e) => {
                const selectedShop = document.getElementById('shopSelect').value;
                if (selectedShop) {
                    const topNum = parseInt(e.target.value);
                    drawShopChart(selectedShop, topNum);
                }
            });

            // 商品顯示數量變化事件
            document.getElementById('productTopSelect').addEventListener('change', (e) => {
                const selectedProduct = document.getElementById('productSelect').value;
                if (selectedProduct) {
                    const topNum = parseInt(e.target.value);
                    drawProductChart(selectedProduct, topNum);
                }
            });

        }

        function drawShopChart(shopName, topNum = 20) {
            // 獲取該門市的所有商品庫存數據
            const shopData = {};
            for (const key in processedData.byShop) {
                const item = processedData.byShop[key];
                if (item.shop === shopName) {
                    shopData[item.product] = item;
                }
            }

            const productNames = Object.keys(shopData)
                .sort((a, b) => parseFloat(shopData[b].average) - parseFloat(shopData[a].average))
                .slice(0, topNum);
            const avgValues = productNames.map(product => parseFloat(shopData[product].average));

            if (charts.shopChart) charts.shopChart.destroy();

            const shopCtx = document.getElementById('shopInventoryChart').getContext('2d');
            charts.shopChart = new Chart(shopCtx, {
                type: 'bar',
                data: {
                    labels: productNames,
                    datasets: [{
                        label: '平均庫存量',
                        data: avgValues,
                        backgroundColor: 'rgba(102, 126, 234, 0.7)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    indexAxis: productNames.length > 10 ? 'y' : 'x',
                    responsive: true,
                    plugins: {
                        title: { display: true, text: `門市: ${shopName} - 商品平均庫存量 (前${topNum}名)` },
                        legend: { display: false }
                    },
                    scales: {
                        x: { ticks: { maxRotation: 45, minRotation: 0, font: { size: 11 } } },
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function drawProductChart(productName, topNum = 20) {
            // 獲取該商品的所有門市庫存數據
            const productData = {};
            for (const key in processedData.byProduct) {
                const item = processedData.byProduct[key];
                if (item.product === productName) {
                    productData[item.shop] = item;
                }
            }

            const shopNames = Object.keys(productData)
                .sort((a, b) => parseFloat(productData[b].average) - parseFloat(productData[a].average))
                .slice(0, topNum);
            const avgValues = shopNames.map(shop => parseFloat(productData[shop].average));

            if (charts.productChart) charts.productChart.destroy();

            const productCtx = document.getElementById('productInventoryChart').getContext('2d');
            charts.productChart = new Chart(productCtx, {
                type: 'bar',
                data: {
                    labels: shopNames,
                    datasets: [{
                        label: '平均庫存量',
                        data: avgValues,
                        backgroundColor: 'rgba(118, 75, 162, 0.7)',
                        borderColor: 'rgba(118, 75, 162, 1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    indexAxis: shopNames.length > 10 ? 'y' : 'x',
                    responsive: true,
                    plugins: {
                        title: { display: true, text: `商品: ${productName} - 各門市平均庫存量 (前${topNum}名)` },
                        legend: { display: false }
                    },
                    scales: {
                        x: { ticks: { maxRotation: 45, minRotation: 0, font: { size: 11 } } },
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        // 標籤切換
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tabName).classList.add('active');
            });
        });

        // 下載功能
        document.getElementById('downloadXlsxByShop').addEventListener('click', () => {
            if (!processedData) return;
            downloadData('xlsx', 'byShop');
        });

        document.getElementById('downloadXlsxByProduct').addEventListener('click', () => {
            if (!processedData) return;
            downloadData('xlsx', 'byProduct');
        });

        function downloadData(format, type) {
            const dataSource = type === 'byShop' ? processedData.byShop : processedData.byProduct;
            const typeLabel = type === 'byShop' ? '按門市' : '按商品';
            
            const rows = [];
            
            // 表頭
            let header;
            if (type === 'byShop') {
                header = ['門市名稱', '商品名稱', ...processedData.dates, '平均庫存量'];
            } else {
                header = ['商品名稱', '門市名稱', ...processedData.dates, '平均庫存量'];
            }
            rows.push(header);
            
            // 數據行
            for (const key in dataSource) {
                const item = dataSource[key];
                let row;
                if (type === 'byShop') {
                    row = [item.shop, item.product];
                } else {
                    row = [item.product, item.shop];
                }
                processedData.dates.forEach(date => {
                    row.push(item.dates[date] || 0);
                });
                row.push(parseFloat(item.average));
                rows.push(row);
            }
            
            // 建立 worksheet
            const ws = XLSX.utils.aoa_to_sheet(rows);
            
            // 設置列寬
            const colWidths = [20, 25];
            processedData.dates.forEach(() => colWidths.push(12));
            colWidths.push(12);
            ws['!cols'] = colWidths.map(w => ({ wch: w }));
            
            // 凍結頂部行
            ws['!freeze'] = { xSplit: 0, ySplit: 1 };
            
            // 建立 workbook
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, typeLabel);
            
            // 下載
            const filename = type === 'byShop' ? 'inventory_by_shop.xlsx' : 'inventory_by_product.xlsx';
            XLSX.writeFile(wb, filename);
        }

        // 清除按鈕
        document.getElementById('clearBtn').addEventListener('click', () => {
            selectedFiles = [];
            updateFileList();
            document.getElementById('processBtn').disabled = true;
            document.getElementById('outputSection').classList.remove('active');
            document.getElementById('fileInput').value = '';
            showStatus('', '');
        });
    </script>
</body>
